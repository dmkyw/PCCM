<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qrGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="200" fill="white" stroke="#ddd" stroke-width="2" rx="10"/>
  
  <!-- 二维码模拟图案 -->
  <g fill="url(#qrGradient)">
    <!-- 左上角定位点 -->
    <rect x="20" y="20" width="35" height="35" rx="3"/>
    <rect x="27" y="27" width="21" height="21" rx="2" fill="white"/>
    <rect x="32" y="32" width="11" height="11" rx="1" fill="url(#qrGradient)"/>
    
    <!-- 右上角定位点 -->
    <rect x="145" y="20" width="35" height="35" rx="3"/>
    <rect x="152" y="27" width="21" height="21" rx="2" fill="white"/>
    <rect x="157" y="32" width="11" height="11" rx="1" fill="url(#qrGradient)"/>
    
    <!-- 左下角定位点 -->
    <rect x="20" y="145" width="35" height="35" rx="3"/>
    <rect x="27" y="152" width="21" height="21" rx="2" fill="white"/>
    <rect x="32" y="157" width="11" height="11" rx="1" fill="url(#qrGradient)"/>
    
    <!-- 数据模块 -->
    <rect x="70" y="25" width="5" height="5" rx="1"/>
    <rect x="80" y="25" width="5" height="5" rx="1"/>
    <rect x="90" y="25" width="5" height="5" rx="1"/>
    <rect x="100" y="25" width="5" height="5" rx="1"/>
    <rect x="110" y="25" width="5" height="5" rx="1"/>
    <rect x="120" y="25" width="5" height="5" rx="1"/>
    
    <rect x="25" y="70" width="5" height="5" rx="1"/>
    <rect x="35" y="70" width="5" height="5" rx="1"/>
    <rect x="45" y="70" width="5" height="5" rx="1"/>
    <rect x="70" y="70" width="5" height="5" rx="1"/>
    <rect x="80" y="70" width="5" height="5" rx="1"/>
    <rect x="90" y="70" width="5" height="5" rx="1"/>
    <rect x="100" y="70" width="5" height="5" rx="1"/>
    <rect x="110" y="70" width="5" height="5" rx="1"/>
    <rect x="120" y="70" width="5" height="5" rx="1"/>
    <rect x="130" y="70" width="5" height="5" rx="1"/>
    <rect x="150" y="70" width="5" height="5" rx="1"/>
    <rect x="160" y="70" width="5" height="5" rx="1"/>
    <rect x="170" y="70" width="5" height="5" rx="1"/>
    
    <!-- 更多数据模块 -->
    <rect x="70" y="80" width="5" height="5" rx="1"/>
    <rect x="90" y="80" width="5" height="5" rx="1"/>
    <rect x="110" y="80" width="5" height="5" rx="1"/>
    <rect x="130" y="80" width="5" height="5" rx="1"/>
    <rect x="150" y="80" width="5" height="5" rx="1"/>
    <rect x="170" y="80" width="5" height="5" rx="1"/>
  </g>
  
  <!-- 医院图标 -->
  <g transform="translate(85, 85)">
    <circle cx="15" cy="15" r="25" fill="white" stroke="url(#qrGradient)" stroke-width="3"/>
    <path d="M10 15 L20 15 M15 10 L15 20" stroke="url(#qrGradient)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 标签 -->
  <text x="100" y="190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#666">医院公众号</text>
</svg>